version: '3.8'

services:
  # Python AI Face Recognition Microservice
  python-engine:
    build:
      context: ./python-engine
      dockerfile: Dockerfile
    container_name: face-attendance-python
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  # Node.js API Gateway & React Static Client
  web-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face-attendance-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PYTHON_ENGINE_URL=http://python-engine:5001
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    depends_on:
      - python-engine
